<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Panel</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/"><span class="logo">&gt;_</span><span>Claude Panel</span></a>
  <span class="srv" id="server-pill" role="img" aria-label="bağlanıyor" title="bağlanıyor"></span>
  <nav class="crumbs" id="crumbs"></nav>
  <span class="grow"></span>
  <span class="pill" id="presence-pill" hidden></span>
  <a class="btn icon" href="#/ayarlar" aria-label="Ayarlar" title="Ayarlar">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
  </a>
  <div class="quota-wrap" id="layout-wrap" hidden>
    <button class="btn" id="layout-btn" aria-expanded="false" aria-controls="layout-pop" aria-haspopup="true">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16M12 12h9"/></svg>
      <span id="layout-cur">Görünüm</span>
    </button>
    <div class="quota-pop menu-pop" id="layout-pop" hidden></div>
  </div>
  <div class="quota-wrap">
    <button class="btn icon notif-btn" id="notif-btn" aria-expanded="false" aria-controls="notif-pop" aria-label="Bildirimler" title="Bildirimler">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span class="notif-count" id="notif-count" hidden></span>
    </button>
    <div class="quota-pop notif-pop" id="notif-pop" hidden></div>
  </div>
  <div class="quota-wrap">
    <button class="btn icon" id="quota-btn" aria-expanded="false" aria-controls="quota-pop" aria-label="Kota" title="Kota">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#34d1a0" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 18a8 8 0 1 1 16 0"/><path d="M12 18l4-6"/></svg>
    </button>
    <div class="quota-pop" id="quota-pop" hidden></div>
  </div>
  <button class="btn icon" id="bekci-btn" hidden aria-pressed="false" aria-label="Bekçi" title="Bekçi">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
  </button>
</header>
<main id="app"></main>
<div class="toast" id="toast" role="status" hidden></div>
<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script src="/js/core.js"></script>
<script src="/js/projects.js"></script>
<script src="/js/setup.js"></script>
<script src="/js/work.js"></script>
<script src="/js/improve.js"></script>
<script src="/js/assistant.js"></script>
<script src="/js/settings.js"></script>
<script src="/js/bekci.js"></script>
<script src="/js/topbar.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
